[package]
name = "codec-bench"
version = "0.1.0"
description = "Measures PNG, JPEG and WebP encoders on synthetic screenshot material (docs/34 §10)"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# Development-time only: no product crate depends on any of this. The point of the crate is to
# decide **which** encoder earns a place in `apps/snapclip`, so the codecs live here first and the
# product's Cargo.toml stays untouched until a measurement says otherwise.
#
# Two pins are deliberate:
#   * `zenjpeg` default features are `decoder` + `yuv` and do **not** include `trellis`, so the
#     feature list says so explicitly (crates.io metadata, docs/34 §9).
#   * `zenwebp 0.4.5` is yanked, so the version is `=0.4.4`.
[dependencies]
# `decoder` is needed by the quality run: JPEG is lossy, so its output has to be decoded before
# SSIM/PSNR can be computed against the lossless PNG the same asset produced (docs/34 §11).
zenjpeg = { version = "=0.8.4", default-features = false, features = ["trellis", "decoder"] }
mozjpeg-rs = { version = "=0.9.2", default-features = false }
zenwebp = "=0.4.4"
png = "0.18.1"
# zenjpeg re-exports `Stop` but not `Unstoppable`; the decoder asks for `impl Stop`.
enough = "0.4.5"
# The scroll pipeline is measured through the real tracker, not a copy of it, so the bench depends
# on the capture crate with its `test-support` feature. The dependency only goes this way: nothing
# in the product ever depends on the bench or on its codec dependencies.
snapclip-capture = { path = "../../crates/snapclip-capture", features = ["test-support"] }
