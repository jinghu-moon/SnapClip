[package]
name = "snapclip-model"
version = "0.1.0"
description = "Framework-free value types and event summaries shared by SnapClip's capability crates"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
half = { version = "2.7", default-features = false, features = ["std"] }
yue-color = { path = "../../../GPUI-Yue-Component/crates/yue-color" }

[dev-dependencies]
# Test-only: the wire-format test for `ImageDimensions` pins the JSON the front end
# reads. Production dependencies remain serialization, FP16 value types and pure color math.
serde_json = "1"
