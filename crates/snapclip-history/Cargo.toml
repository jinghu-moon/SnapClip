[package]
name = "snapclip-history"
version = "0.1.0"
description = "SnapClip's clipboard history and capture artifacts: storage, dedup and the clipboard adapters"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
snapclip-clipboard = { path = "../snapclip-clipboard" }
snapclip-model = { path = "../snapclip-model" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
blake3 = "1.5"
flate2 = "1"
# The store keeps a payload list as a JSON column, so this is a runtime dependency, not a
# test-only one.
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# The PNG encoder moves here at T2.4 (see the delivery protocol in docs/23 §5): capture
# hands over bytes, history owns turning them into a file.
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
