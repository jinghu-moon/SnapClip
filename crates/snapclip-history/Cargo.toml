[package]
name = "snapclip-history"
version = "0.1.0"
description = "SnapClip's clipboard history and capture artifacts: storage, dedup and the clipboard adapters"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
snapclip-model = { path = "../snapclip-model" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
blake3 = "1.5"
rusqlite = { version = "0.32", features = ["bundled"] }
# The PNG encoder moves here at T2.4 (see the delivery protocol in docs/23 §5): capture
# hands over bytes, history owns turning them into a file.
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }

# The clipboard adapter (T2.6) is Win32; the stores above are plain data code, which is
# why this crate is **not** gated on Windows the way `snapclip-capture` is.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
