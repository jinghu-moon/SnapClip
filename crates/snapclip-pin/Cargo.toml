[package]
name = "snapclip-pin"
version = "0.1.0"
description = "SnapClip's independent Windows pin-window capability"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
gpui-kit = "0.8"
yue-component = { path = "../../../GPUI-Yue-Component/crates/yue-component", default-features = false }
async-channel = "2.5"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
snapclip-model = { path = "../snapclip-model" }
snapclip-ui = { path = "../snapclip-ui" }

[target.'cfg(windows)'.dependencies]
parking_lot = "0.12"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The existing opt-in filter-comparison test writes PNG sheets.
png = "0.18"

[features]
headless-tests = ["gpui-kit/test-support"]
