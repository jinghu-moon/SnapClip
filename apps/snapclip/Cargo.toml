[package]
name = "snapclip-app"
version = "0.1.0"
description = "SnapClip's GPUI shell"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# The package is `snapclip-app`: the shell names itself after its role, and the directory
# stays `apps/snapclip` as the plan specifies. Nothing else in the workspace claims the bare
# `snapclip` name.

[dependencies]
# One dependency for the UI, as the Coding Guides require: GPUI itself is
# `use gpui_kit::*;`, and the layers are gpui_kit::{component, base, assets, platform}.
gpui-kit = "0.7"

# Capability crates, not UI: the shell composes them and owns no feature logic of its own.
snapclip-model = { path = "../../crates/snapclip-model" }
snapclip-ui = { path = "../../crates/snapclip-ui" }
snapclip-history = { path = "../../crates/snapclip-history" }
snapclip-capture = { path = "../../crates/snapclip-capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# RTF 1.9.1, clipboard-grade (docs/23 rich card). Chosen over `rtf-parser` because it is the
# one that models what breaks on Chinese content: `\ucN` fallback skipping and surrogate
# pairs. `std` for owned runs, `codepage` because `\'xx` byte escapes under `\ansicpg936`
# (GBK) are common in Chinese documents and would otherwise be mojibake.
rclip-rtf = { version = "0.1", features = ["std", "codepage"] }

# The DBCS half of the same problem, which `rclip-codepage` states up front it does not do:
# "Shift-JIS, GBK, Big5 and the other DBCS". We decode `\'xx` groups ourselves (see
# `history/rich.rs`) and re-emit them as `\uN?`, which rclip-rtf handles correctly. `encoding_rs`
# is the Firefox encoding library: MIT/Apache, and its GBK/Big5/Shift-JIS tables are the ones
# that have been wrong the least.
encoding_rs = "0.8"

# The shell's typed event channel (docs/23 T4.5). `async_channel` is the same channel
# implementation GPUI already links, so this adds a direct edge, not a second runtime.
async-channel = "2.5"

# The scroll export encoder (docs/30 §17.7, docs/31 P4.02). It belongs here and not in
# `snapclip-capture`: which encoder to use is a decision about the *output format*, not a fact about
# capturing, and the port the capture crate declares must stay implementable without it.
# `snapclip-capture` must never see this line — that is `P4.01`'s exit condition ② (`cargo tree -p
# snapclip-capture -e normal` has no `png` row) and §28.4's direction. 0.18 is the version `image`
# 0.25 already puts in this graph, so this adds an edge, not a second copy. Promoted from
# `[dev-dependencies]`, where `tests/png_params_probe.rs` (P0.04) needed it to measure the real
# encoder rather than a lookalike.
png = "0.18"

# The tray icon is Win32 (docs/23 T4.6): `gpui-kit` has no tray component, so the shell owns
# a hidden window and `Shell_NotifyIconW` itself. Same major as `snapclip-capture` already
# uses, so this adds no second copy of the bindings to the graph.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  # The save panel's backdrop, rounded corners and dark frame (`docs/41` S2): DWM attributes are the
  # only way an ordinary window gets the mock's material, and `HiDpi` is what tells us the dip scale.
  "Win32_Graphics_Dwm",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Performance",
  # `GetLocalTime` — the naming template's `[日期]` and `[时间]` mean the day the file was written,
  # and it must be the user's local day rather than UTC. The bindings put it here, next to the other
  # system information calls.
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  # `WM_MOUSELEAVE` — the notification that says the cursor left the pin, which is when the
  # mouse capture taken for wheel routing has to be handed back. It is odd but checked: this
  # one message constant lives under `UI::Controls` in the bindings, not under
  # `UI::WindowsAndMessaging` with every other `WM_*`. That is where the platform declares it
  # (with the rest of the *shell* messages, `WM_MOUSEHOVER`/`WMN_*`), so there is nowhere
  # smaller to get it from.
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Source-app icons for history rows: 32px renders crisply in a 16px row.
win-icon-extractor = { version = "0.3", default-features = false, features = ["png", "cache"] }

# The pin host thread hands its `JoinHandle` across threads so `Drop` can join it. 0.12 is
# already in this graph (a `gpui` dependency), so this adds a direct edge, not a second copy.
# Chosen over `std::sync::Mutex` because it has no poisoning: a panic on the pin thread must not
# turn the next `Drop` into a second panic.
parking_lot = "0.12"

# The pin module (docs/34) reports failures that cross three layers — capture, the
# command handler, the window host thread — and the interesting part of each is the
# chain, not the leaf. `anyhow` is what the GPUI stack already links (gpui-base and
# gpui-kit both depend on it), so this adds a direct edge, not a second copy. The
# capability crates keep their own typed errors; this is the shell's boundary only.
anyhow = "1"

# Clipboard writes belong to the shell; `mark_clipboard_excluded` (below, through
# snapclip-history) is what keeps our own copy out of the history.
arboard = "3.6"

# Lossy export (`docs/34` §9–11). Baseline + 4:4:4 at q92, with the Huffman optimiser only where
# the whole frame fits a budget, because switching it on makes this crate buffer the frame
# (456.5 MB on a 1280x30000 strip) instead of streaming it (13.9 MB).
#
# `default-features = false` because the defaults pull in the decoder, which a sink does not need;
# `trellis` is enabled because that is the feature that makes the optimiser exist at all, even
# though this sink never selects the more aggressive preset. Pinned to `=` because the crate is new
# (first release 2026-06, 81k lines): an upgrade has to re-run `tools/codec-bench` before it is
# trusted with anyone's screenshots.
zenjpeg = { version = "=0.8.4", default-features = false, features = ["trellis"] }

# Lossless WebP (`docs/34` §9.1, §13). Pinned to 0.4.4 because 0.4.5 was yanked. Default features
# are kept on purpose: turning them off removes the `Encoder` itself, which the bench found the
# hard way.
zenwebp = "=0.4.4"


# `Stop`'s `check` names `enough::reason::StopReason`, and `zenjpeg` re-exports the trait without
# the reason type. `enough` is already in this graph through `zenjpeg` (0.4.5), so this is a direct
# edge to the type a cancellation has to return, not a second copy of anything.
enough = "0.4"

[features]
# Test-only: `.test_support()` comes from gpui-kit's test-support feature. Forwarding it
# through this crate's own feature is what keeps the production build free of test support
# while `cargo test -p snapclip-app --features test-support` can find UI nodes by id.
test-support = ["gpui-kit/test-support"]

[dev-dependencies]
# Test-only: the model tests build payload references, which are keyed by a blake3 hash.
blake3 = "1.5"
# Same version and source as the normal dependency, with the helpers the guides require.
gpui-kit = { version = "0.7", features = ["test-support"] }
# Test-only cross-decoder for the lossless WebP round-trip: decoding with the same library that
# encoded would let a shared bug cancel itself out (docs/34 §13).
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
