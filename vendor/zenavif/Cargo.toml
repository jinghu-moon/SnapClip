    "encode",
    "ravif/imazen",
]
encode-threading = [
    "encode",
    "ravif/threading",
]
unsafe-asm = [
    "dep:rav1d",
    "rav1d/asm",
]
zencodec = [
    "dep:zencodec",
    "zenavif-parse/zencodec",
]

