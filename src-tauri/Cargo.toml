[package]
name = "snapclip"
version = "0.1.0"
description = "Windows screenshot, clipboard history, and pinboard utility"
authors = ["you"]
license = "AGPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snapclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.5"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
# TEMPORARY: `rapid-ocr-rs` is mid-way through breaking changes and its API is
# currently unstable, so the ONNX / PP-OCR engine is gated behind the non-default
# `ocr-rapid` feature instead of being built into every target. SnapClip keeps the
# built-in Windows OCR engine, which does not depend on this crate. Re-enable by
# adding `ocr-rapid` once `rapid-ocr-rs`'s public API has settled.
rapid-ocr-rs = { path = "../crates/rapid-ocr-rs", default-features = false, features = ["ort-runtime"], optional = true }

[features]
# Default build excludes the ONNX / PP-OCR path (see the `rapid-ocr-rs` note above).
default = []
# ONNX / PP-OCR engine via `rapid-ocr-rs`; opt in with `--features ocr-rapid`.
ocr-rapid = ["dep:rapid-ocr-rs"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Numerics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# `windows` 0.61 hands Direct2D geometry to and from this crate but does not
# re-export it, so it has to be a direct dependency to name `Vector2`.
windows-numerics = "0.2"
win-icon-extractor = { version = "0.3", default-features = false, features = ["png", "cache"] }
arboard = "3.6"
