<title>SnapClip browser element demo</title>
<!--
  Fixture page for `uia_provider::tests::browser_element_probe`.

  Open it in a browser to look at it; the probe opens it with `?truth=1`, which makes the page
  publish its own measured boxes (see `publishTruth` below) in the window title. That is the
  point of this file:

    * the page is the **single source of truth for geometry** — nothing about the boxes is
      hand-computed, so a `<li>` or a table cell can never drift from its expectation;
    * the manifest below is the single source for *intent* (which element, what it is, and what
      a correct deep selection must publish for a probe point inside it).

  `expect` says what the probe point must resolve to:
    "self"   -> this fixture's own measured rectangle
    "<id>"   -> another fixture's rectangle (stacking, nesting, container-vs-item cases)
    "none"   -> nothing finer than the page: the fixture must not be in the accessibility tree
                at all (`display:none`, `aria-hidden`)
    "inside_self"  -> the answer must lie inside this fixture's rectangle (measured: Chromium
                      exposes a text-only anchor as its text run, not as an anchor node)
    "covers_self"  -> the fixture itself is not exposed, so the nearest exposed ancestor may
                      answer — as long as it covers the fixture and stays local (measured: a
                      disabled Chromium input is a Group holding a text run)
  `probe` is an optional [dx, dy] offset inside this fixture's rectangle (default: its centre).
  `role`/`name` are informational — the probe prints what the tree actually exposes next to them.
  `optional: true` marks cases whose exact answer is implementation-defined (rotated boxes,
  canvas, svg, iframe, shadow DOM, layout-only wrappers) and the one measured *limitation*
  (`input-disabled`: Chromium paints a nameless `Pane` over the input — the system's own hit test
  returns that pane — so the page's declared 240x56 control and the system's 284x40 box are two
  different questions about the same point, and the precision top-up in docs/21 §5.7 adopts the
  latter). Those are measured and printed, never asserted.

  `deep-scroll-box` / `deep-item` are an asserted pair for the *layout box* shape: the item is one
  element 20000 px tall inside a 100 px scrollport scrolled 5000 px down, so Chromium reports it as
  `358x20000 at (73,-3983)` — the same shape a chat page measured in the product (`1153x22623`).
  What may be published is its visible part (`358x100`), which is what the two rows assert, and the
  probe fails the whole run if any published box sticks out of the window (docs/21 §5.9).

  `plain-div` exists to be **looked at**, not asserted: it is a layout-only wrapper with no role, no
  name and no text of its own, which is the one shape Blink never exposes to platform accessibility
  APIs (docs/21 §10). The probe's `[sources]` phase reports what each candidate source can see at a
  point inside it — the control view answers the whole page, and the raw view adds nothing.
-->

  .fixture { position: absolute; box-sizing: border-box; margin: 0; }

</style>

<script>
const SVG_ICON = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80">' +
  '<rect width="200" height="80" fill="#dfe8ff" stroke="#4a6fb5"/>' +
  '<circle cx="60" cy="40" r="22" fill="#4a6fb5"/>' +
  '<rect x="100" y="24" width="76" height="32" rx="6" fill="#8fb0f0"/></svg>');

function make(className) {
  const element = document.createElement('div');
  element.className = 'fixture ' + (className || '');
  return element;
}

function listRow(id, label) {
  return '<div id="' + id + '" role="listitem" style="height:28px;display:flex;align-items:center;' +
    'padding-left:10px">' + label + '</div>';
}

// Each builder returns the tag name to create and fills `el` with attributes/children.
const builders = {
  button: (el, entry) => { el.className = 'fixture cap'; el.textContent = entry.text;
                           el.disabled = !!entry.disabled; return 'button'; },
  // A plain inline link: the flex-centred variant stops Chromium from exposing the anchor as a
  // node of its own (measured — the accessibility tree then lists only its text run).
  link: (el, entry) => { el.className = 'fixture frame';
                         el.style.cssText += 'display:flex;align-items:center;' +
                           'justify-content:center;font-weight:600';
                         el.textContent = entry.text; el.href = '#'; return 'a'; },
  'role-button': (el, entry) => { el.className = 'fixture cap'; el.textContent = entry.text;
                                  el.tabIndex = 0; el.setAttribute('role', 'button'); return 'div'; },
  'link-icon': (el) => { el.className = 'fixture cap'; el.setAttribute('aria-label', 'Icon Link');
                         el.href = '#'; el.innerHTML = '<img alt="" width="120" height="40" src="' +
                         SVG_ICON + '">'; return 'a'; },
  input: (el, entry) => { el.className = 'fixture frame'; el.value = entry.text;
                          // `readonly` + `aria-disabled`, not the `disabled` attribute: Chromium
                          // does not expose a natively disabled form control as a control at all
                          // (measured: it becomes a Group holding a text run), so a fixture that
                          // used it would be asserting a box the tree does not contain.
                          el.readOnly = !!entry.readonly;
                          if (entry.readonly) {
                            el.setAttribute('aria-disabled', 'true');
                          }
                          el.setAttribute('aria-label', entry.name); return 'input'; },
  checkbox: (el, entry) => { el.className = 'fixture muted'; el.innerHTML =
    '<label class="row" style="gap:8px"><input id="checkbox-input" type="checkbox" checked>' +
    entry.text + '</label>'; return 'div'; },
  radio: (el, entry) => { el.className = 'fixture muted'; el.innerHTML =
    '<label class="row" style="gap:8px"><input id="radio-input" type="radio" checked>' +
    entry.text + '</label>'; return 'div'; },
  switch: (el) => { el.className = 'fixture muted'; el.tabIndex = 0;
                    el.setAttribute('role', 'switch'); el.setAttribute('aria-checked', 'true');
                    el.setAttribute('aria-label', 'Toggle Switch');
                    el.innerHTML = '<span class="row" style="padding-left:12px">Toggle Switch</span>';
                    return 'div'; },
  select: (el) => { el.className = 'fixture frame'; el.setAttribute('aria-label', 'Select One');
                    el.innerHTML = '<option>One</option><option>Two</option><option>Three</option>';
                    return 'select'; },
  range: (el) => { el.className = 'fixture frame'; el.type = 'range';
                   el.setAttribute('aria-label', 'Range Slider'); return 'input'; },
  textarea: (el, entry) => { el.className = 'fixture frame'; el.value = entry.text;
                             el.setAttribute('aria-label', entry.name); return 'textarea'; },
  img: (el) => { el.className = 'fixture frame'; el.src = SVG_ICON; el.alt = 'Image Box';
                 return 'img'; },
  heading: (el, entry) => { el.className = 'fixture cap'; el.textContent = entry.text;
                            return 'h2'; },
  para: (el, entry) => { el.style.padding = '10px';
                         el.style.font = '15px/1.4 "Segoe UI", sans-serif';
                         el.textContent = entry.text; return 'p'; },
  list: (el) => { el.className = 'fixture frame';
                  el.innerHTML = '<div style="padding:4px 10px">Item List</div>' +
                    listRow('list-item-a', 'List Item A') +
                    listRow('list-item-b', 'List Item B') +
                    listRow('list-item-c', 'List Item C');
                  return 'ul'; },
  table: (el) => { el.className = 'fixture frame';
                   el.innerHTML = '<div style="padding:4px 10px">Data Table</div>' +
                     '<div style="display:grid;grid-template-columns:1fr 1fr">' +
                     ['Cell One', 'Cell Two', 'Cell Three', 'Cell Four'].map((label, index) =>
                       '<div id="table-cell-' + (index + 1) + '" style="height:34px;display:flex;' +
                       'align-items:center;padding-left:10px">' + label + '</div>').join('') +
                     '</div>';
                   return 'table'; },
  'nested-outer': (el, entry) => { el.className = 'fixture dashed';
                                   el.setAttribute('aria-label', entry.name); return 'div'; },
  'nested-mid': (el, entry) => { el.className = 'fixture frame';
                                 el.setAttribute('aria-label', entry.name); return 'div'; },
  'nested-inner': (el, entry) => { el.className = 'fixture cap'; el.textContent = entry.text;
                                   el.style.background = '#e6f7ea';
                                   el.style.borderColor = '#2f8f4a';
                                   // A bare span is only a text run in the accessibility tree; the
                                   // group role is what makes its *box* selectable, which is the
                                   // shape the fixture asserts.
                                   el.setAttribute('role', 'group');
                                   el.setAttribute('aria-label', entry.name);
                                   return 'span'; },
  'stack-back': (el, entry) => { el.className = 'fixture cap'; el.textContent = entry.text;
                                 return 'button'; },
  'stack-front': (el, entry) => { el.className = 'fixture front';
                                  el.setAttribute('aria-label', entry.name); return 'div'; },
  // A layout-only wrapper: no role, no aria-label, no text of its own — the kind of `<div>` the
  // accessibility tree prunes. Probing inside it but away from the inner span is the experiment for
  // "can a source other than the control view see this box?" (docs/21 §10).
  'plain-div': (el) => { el.className = 'fixture dashed';
                         el.innerHTML = '<span style="position:absolute;left:20px;top:20px;' +
                           'width:60px;height:20px">Inner</span>';
                         return 'div'; },
  scroll: (el) => { el.className = 'fixture frame'; el.style.overflow = 'auto';
                    el.setAttribute('aria-label', 'Scroll Container');
                    el.setAttribute('role', 'list');
                    el.innerHTML = '<div style="height:20px"></div>' +
                      Array.from({ length: 10 }, (_, index) =>
                        listRow('scroll-item-' + (index + 1), 'Scroll Item ' + (index + 1))).join('');
                    return 'div'; },
  // A scrollport holding **one** element far taller than the page, scrolled deep. Chromium reports
  // such a node's *layout* box — hundreds of pixels wide and tens of thousands tall, starting above
  // the window — which is the shape a chat page measured in the product (a message column
  // 1153x22623 at (1567,-9870)). What is capturable is only its visible part, so the answer must be
  // clipped by the scrollport above it; this fixture is the gate for that.
  'deep-scroll': (el) => { el.className = 'fixture frame'; el.style.overflow = 'auto';
                    el.setAttribute('aria-label', 'Deep Scroll');
                    el.setAttribute('role', 'group');
                    el.innerHTML = '<div id="deep-item" role="group" aria-label="Deep Item" ' +
                      'style="height:20000px;background:#eef2ff">Deep Item</div>';
                    return 'div'; },
  iframe: (el) => { el.className = 'fixture frame';
                    el.srcdoc = '<!doctype html><body style="margin:0;font:14px sans-serif">' +
                      '<button id="iframe-button" style="position:absolute;left:40px;top:40px;' +
                      'width:160px;height:48px">Iframe Button</button></body>';
                    return 'iframe'; },
  canvas: (el, entry) => { el.className = 'fixture frame';
                           el.setAttribute('aria-label', entry.name);
                           el.width = 176; el.height = 200;
                           return 'canvas'; },
  svg: (el, entry) => { el.className = 'fixture frame';
                        el.setAttribute('aria-label', entry.name);
                        el.innerHTML = '<svg width="174" height="198" xmlns="http://www.w3.org/2000/svg">' +
                          '<circle cx="86" cy="70" r="46" fill="#4a6fb5"/>' +
                          '<rect x="30" y="130" width="114" height="40" rx="8" fill="#8fb0f0"/>' +
                          '</svg>';
                        return 'div'; },
  shadow: (el) => { el.className = 'fixture frame'; return 'div'; },
  details: (el) => { el.className = 'fixture frame'; el.innerHTML =
      '<summary id="details-summary" style="height:44px;display:flex;align-items:center;' +
      'padding-left:12px">Details Node</summary>' +
      '<div style="padding:12px">Collapsed content</div>';
      return 'details'; },
  contenteditable: (el, entry) => { el.className = 'fixture frame';
                                    el.style.padding = '12px';
                                    el.contentEditable = 'true';
                                    el.setAttribute('aria-label', entry.name);
                                    el.textContent = entry.text; return 'div'; },
  hidden: (el, entry) => { el.className = 'fixture cap'; el.style.display = 'none';
                           el.textContent = entry.text; return 'div'; },
  'aria-hidden': (el, entry) => { el.className = 'fixture cap';
                                  el.setAttribute('aria-hidden', 'true');
                                  el.textContent = entry.text; return 'div'; },
  rotated: (el, entry) => { el.className = 'fixture cap';
                            el.setAttribute('aria-label', entry.name);
                            el.style.transform = 'rotate(-8deg)'; return 'div'; },
  'link-image': (el) => { el.className = 'fixture'; el.href = '#';
                          el.setAttribute('aria-label', 'Picture Link');
                          el.innerHTML = '<img alt="" width="238" height="118" src="' + SVG_ICON + '">';
                          return 'a'; },
  'aria-hidden-button': (el, entry) => { el.className = 'fixture cap';
                                         el.setAttribute('aria-hidden', 'true');
                                         el.textContent = entry.text; return 'button'; },
  progress: (el) => { el.className = 'fixture frame'; el.value = 62; el.max = 100;
                      el.setAttribute('aria-label', 'Progress Bar'); return 'progress'; },
};

/// Post-creation work that needs the real element (a canvas context, a shadow root).
const after = {
  // Scroll the deep item's layout box far above the scrollport: its top ends up thousands of pixels
  // off-screen, which is exactly what the product met on a chat page.
  'deep-scroll': (node) => { node.scrollTop = 5000; },
  canvas: (node) => {
    node.width = 176; node.height = 200;
    const context = node.getContext('2d');
    context.fillStyle = '#4a6fb5';
    context.fillRect(20, 20, 136, 160);
  },
  shadow: (node) => {
    node.attachShadow({ mode: 'open' }).innerHTML =
      '<style>:host{display:block}</style>' +
      '<button id="shadow-button" style="position:absolute;left:44px;top:60px;' +
      'width:192px;height:56px">Shadow Button</button>';
  },
};

const manifest = JSON.parse(document.getElementById('manifest').textContent);

function buildFixtures() {
  for (const entry of manifest) {
    if (entry.kind === 'generated') {
      continue; // lives inside another fixture; only its measured box is interesting
    }
    const [x, y, width, height] = entry.rect;
    const holder = make('frame');
    const tag = builders[entry.kind] ? builders[entry.kind](holder, entry) : 'div';
    const node = document.createElement(tag);
    for (const attribute of holder.attributes) {
      node.setAttribute(attribute.name, attribute.value);
    }
    while (holder.firstChild) {
      node.appendChild(holder.firstChild);
    }
    node.id = entry.id;
    node.classList.add('fixture');
    node.style.left = x + 'px';
    node.style.top = y + 'px';
    node.style.width = width + 'px';
    node.style.height = height + 'px';
    document.body.appendChild(node);
    if (after[entry.kind]) {
      after[entry.kind](node);
    }

    const caption = make('caption');
    caption.style.left = x + 'px';
    caption.style.top = y + 'px';
    caption.textContent = entry.id;
    document.body.appendChild(caption);
  }
}

/// Publish every fixture's measured box, so the probe never has to guess a box model.
///
/// `[id]` also picks up the ids generated inside the fixtures (list rows, table cells, scroll
/// rows); shadow DOM and iframe documents are outside `document.querySelectorAll`, so their
/// elements are looked up explicitly — a same-origin `srcdoc` frame is readable, and its boxes
/// need the frame's own offset added.
function publishTruth() {
  const truth = {};
  for (const element of document.querySelectorAll('[id]')) {
    if (element.id === 'manifest') continue;
    const box = element.getBoundingClientRect();
    truth[element.id] = [Math.round(box.left), Math.round(box.top),
                         Math.round(box.width), Math.round(box.height)];
  }
  const host = document.getElementById('shadow-box');
  const shadowButton = host && host.shadowRoot && host.shadowRoot.getElementById('shadow-button');
  if (shadowButton) {
    const box = shadowButton.getBoundingClientRect();
    truth['shadow-button'] = [Math.round(box.left), Math.round(box.top),
                              Math.round(box.width), Math.round(box.height)];
  }
  const frame = document.getElementById('iframe-box');
  const inner = frame && frame.contentDocument && frame.contentDocument.getElementById('iframe-button');
  if (inner) {
    const outer = frame.getBoundingClientRect();
    const box = inner.getBoundingClientRect();
    truth['iframe-button'] = [Math.round(outer.left + box.left), Math.round(outer.top + box.top),
                              Math.round(box.width), Math.round(box.height)];
  }
  if (location.search.includes('truth')) {
    // The probe reads this back with GetWindowTextW: the only channel out of the page.
    document.title = 'SNAPCLIP_TRUTH:' + JSON.stringify(truth);
  }
  return truth;
}

/// A broken fixture must say so through the same channel the probe reads, instead of looking
/// like "the page never loaded".
function report(error) {
  document.title = 'SNAPCLIP_ERROR:' + (error && error.message ? error.message : String(error));
}

window.addEventListener('load', () => {
  try {
    buildFixtures();
    publishTruth();
  } catch (error) {
    report(error);
  }
});
</script>
</body>
</html>
